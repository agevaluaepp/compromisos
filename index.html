.mapwrap{position:relative;background:#dfe8f3;overflow:hidden;min-height:0}

.ctrl{position:absolute;right:16px;top:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
.ctrl button{width:40px;height:40px;border:0;border-radius:10px;background:#fff;color:var(--navy);font-weight:800;font-size:19px;box-shadow:0 2px 10px rgba(15,31,61,.18)}

var TIPO = {compromiso:"Compromiso expresado por Dorantes", peticion:"Petición o planteamiento vecinal", logro:"Obra o logro que él cita"};

function esc(s){return s;}
function byId(i){return DATA.filter(function(d){return d.id===i;})[0];}
function matches(d){ return filt==="all" || d.tipo===filt; }
function siteRows(s){ return s.ids.map(byId).filter(Boolean); }
function siteComp(s){
  var rs = siteRows(s).filter(matches); if(!rs.length) return "none";
  if(rs.some(function(r){return r.tipo==="compromiso";})) return "compromiso";
  if(rs.some(function(r){return r.tipo==="peticion";})) return "peticion";
  return "logro";
}
function visibleSites(){ return GEO.sites.filter(function(s){ return s.ids.length && siteRows(s).some(matches); }); }
function compBadge(c){
  if(c==="municipal") return '<span class="b ok">Tema de competencia municipal</span>';
  if(c==="concurrente") return '<span class="b warn">Tema que requiere acuerdo</span>';
  return '<span class="b crit">Tema no municipal</span>';
}
function srcLinks(d){ return d.urls.map(function(u,i){ return '<a href="'+u+'" target="_blank" rel="noopener">Nota '+(i+1)+'</a>'; }).join(" · "); }
function card(d){
  var h = '<article class="card k-'+d.tipo+'"><div class="top">';
  h += '<div class="tipo t-'+d.tipo+'">'+TIPO[d.tipo]+'</div>';
  h += '<p class="enun">'+d.enun+'</p>';
  h += '<div class="badges">'+(d.tipo==="compromiso"?'<span class="b '+d.dict+'">'+d.dictTxt+'</span>':'<span class="b gray">No es un compromiso</span>')+compBadge(d.comp)+'<span class="b">'+d.tema+'</span></div>';
  h += '<div class="meta"><span><i>Quién lo plantea</i>'+d.quien+'</span><span><i>Fecha</i>'+d.fecha+'</span><span><i>Fuente</i>'+d.fuente+' · '+srcLinks(d)+'</span></div></div>';
  h += '<button class="more" data-id="'+d.id+'">Ver lo que dijo y lo que no</button>';
  h += '<div class="ficha" id="f'+d.id+'"><dl>';
  h += '<div class="row"><dt>Lo que dijo la nota</dt><dd>'+d.dicho+'</dd></div>';
  h += '<div class="row"><dt>Lo que no dijo</dt><dd>'+d.nodicho+'</dd></div>';
  if(d.tipo==="compromiso"){
    h += '<div class="row"><dt>Problema público</dt><dd>'+d.problema+'</dd></div>';
    h += '<div class="row"><dt>Línea base</dt><dd>'+PEND+'</dd></div>';
    h += '<div class="row"><dt>Indicador propuesto</dt><dd>'+d.indicador+'</dd></div>';
    h += '<div class="row"><dt>Meta y plazo</dt><dd>'+PEND+'</dd></div>';
    h += '<div class="row"><dt>Competencia municipal</dt><dd>'+d.fund+' <span class="pend">(dictamen preliminar)</span></dd></div>';
    h += '<div class="row"><dt>Dependencia responsable</dt><dd>'+d.dep+' '+VER+'</dd></div>';
    h += '<div class="row"><dt>Concurrencia requerida</dt><dd>'+d.conc+'</dd></div>';
    h += '<div class="row"><dt>Costo preliminar</dt><dd>'+PEND+'</dd></div>';
    h += '<div class="row"><dt>Riesgo principal</dt><dd>'+d.riesgo+'</dd></div>';
    if(d.sug) h += '<div class="row"><dt>Redacción que sí se sostiene</dt><dd><div class="sug">'+d.sug+'</div></dd></div>';
  } else if(d.sug){
    h += '<div class="row"><dt>Si se quisiera convertir en compromiso</dt><dd><div class="sug">'+d.sug+'</div><span class="pend">Propuesta de AGEVALÚA. No es algo que haya dicho el candidato.</span></dd></div>';
  }
  h += '</dl></div></article>';
  return h;
}

/* ---------------- panel ---------------- */
var panel = document.getElementById("panel");
function chipsHtml(){
  var L = [["all","Todos",null],["compromiso","Compromiso suyo","#139a52"],["peticion","Petición vecinal","#e8930c"],["logro","Obra o logro que cita","#2457ff"]];
  return '<div class="chips" id="chips">'+L.map(function(x){
    return '<button class="chip" data-f="'+x[0]+'" aria-pressed="'+(filt===x[0])+'">'+(x[2]?'<i style="background:'+x[2]+'"></i>':'')+x[1]+'</button>';
  }).join("")+'</div>';
}
function homeHtml(){
  var nC = DATA.filter(function(d){return d.tipo==="compromiso";}).length;
  var h = '<div class="pad"><p class="eyebrow">Municipio de Querétaro · Proceso electoral 2027</p>';
  h += '<h1>Compromisos verificables de <em>Agustín Dorantes</em></h1>';
  h += '<p class="lead">Lo que se le atribuye en notas de prensa, separado en lo que él dijo y lo que no: compromisos suyos, peticiones de los vecinos y obras que él cita. Toca una colonia en el mapa.</p>';
  h += '<div class="tiles"><div class="tile t1"><div class="big">'+DATA.length+'</div><div class="lab">registros revisados contra su nota original</div></div>';
  h += '<div class="tile t3"><div class="big">'+nC+'</div><div class="lab">compromiso expresado por él</div></div>';
  h += '<div class="tile t2"><div class="big">'+(DATA.length-nC)+'</div><div class="lab">no son compromisos: peticiones vecinales u obras que cita</div></div></div>';
  h += '<h3 class="sec">Filtrar por tipo</h3>'+chipsHtml();
  h += '<h3 class="sec">Colonias con registros</h3><div class="rows">';
  var vs = visibleSites();
  if(!vs.length) h += '<div class="empty">Ninguna colonia coincide con ese filtro.</div>';
  vs.forEach(function(s){
    var n = siteRows(s).filter(matches).length;
    h += '<button class="row-s" data-cp="'+s.cp+'"><span class="dot" style="background:'+COL[siteComp(s)]+'">'+n+'</span><span><b>'+s.name+'</b><span class="m">CP '+s.cps[0]+'</span></span></button>';
  });
  h += '</div><button class="about-btn" id="about">Metodología, etiquetas y fuentes</button></div>';
  return h;
}
function siteHtml(){
  var s = GEO.sites.filter(function(x){return x.cp===sel;})[0];
  var rows = siteRows(s).filter(matches);
  var h = '<div class="pad"><button class="back" id="back">← Todas las colonias</button>';
  h += '<p class="eyebrow">Colonia</p><h2 class="site">'+s.name+'</h2>';
  h += '<div class="smeta"><span><b>CP</b> '+s.cps.join(", ")+'</span></div>';
  h += '<h3 class="sec">'+rows.length+(rows.length===1?' registro':' registros')+'</h3>';
  h += rows.map(card).join("");
  h += '</div>';
  return h;
}
function aboutHtml(){
  var h = '<div class="pad"><button class="back" id="back">← Volver</button><h2 class="site">Cómo leer este tablero</h2>';
  h += '<h3 class="sec" style="margin-top:14px">Tipos de registro</h3>';
  h += '<div class="kb"><span class="b ok">Compromiso suyo</span><span>Dorantes dijo que hará, gestionará o entregará algo. Solo estos se dictaminan por competencia y pueden convertirse en compromisos medibles.</span></div>';
  h += '<div class="kb"><span class="b warn">Petición vecinal</span><span>Los vecinos lo piden; la nota no registra que él se comprometa.</span></div>';
  h += '<div class="kb"><span class="b" style="background:#e3eaff;color:#1a3fb8">Obra o logro</span><span>Él cita una obra en curso o ya lograda. No es una promesa a futuro.</span></div>';
  h += '<h3 class="sec" style="margin-top:18px">Cómo se verificó</h3><p class="t">Cada registro se contrastó con el texto de su nota. Varias notas parecen basarse en comunicados de su oficina o en coberturas favorables: son declaraciones reportadas, no verificadas de forma independiente. Donde la nota no dice algo (qué obra, cuándo, quién la ejecuta), aparece como "lo que no dijo".</p>';
  h += '<h3 class="sec">Qué es</h3><p class="t">Prototipo del servicio de Compromisos Verificables. Los dictámenes de competencia son <b>preliminares</b>. Líneas base, metas y costos aparecen pendientes porque no se publican cifras sin fuente.</p>';
  h += '<h3 class="sec">El mapa</h3><p class="t">El contorno es el límite real del municipio (199 vértices, sin simplificar) y las áreas marcadas son polígonos reales de códigos postales, de conjuntos públicos. Un área de código postal no es una colonia: indica la zona, no el predio. No se muestran delegaciones porque no se cuenta con su capa oficial.</p>';
  h += '<h3 class="sec">Fuentes</h3><ul><li><a href="https://queretaro.quadratin.com.mx/agustin-dorantes-da-seguimiento-a-compromisos-en-la-colonia-sauces/">Seguimiento a compromisos en la colonia Sauces</a> — Quadratín Querétaro, 16 de octubre de 2026.</li><li><a href="https://www.poderinformativo.com.mx/agustin-dorantes-regresa-a-sauces-y-se-compromete-a-gestionar-mas-obras-para-la-colonia/">Regreso a Sauces y compromiso de gestionar más obras</a> — Poder Informativo, octubre de 2026.</li><li><a href="https://elmunicipalqro.com/queretaro/mi-compromiso-agustin-dorantes-2/">Seguimiento de gestiones en Lomas de Casa Blanca</a> — El Municipal Qro, 6 de noviembre de 2026.</li><li><a href="https://noticiasdequeretaro.com.mx/2026/05/14/cumple-agustin-dorantes-trabajos-de-gestion-con-vecinos-del-sur-de-la-capital-queretana/">Gestión con vecinos del sur de la capital</a> — Noticias de Querétaro, 14 de mayo de 2026.</li><li><a href="https://codigoqro.mx/nota/local/2026/05/13/dorantes-atiende-peticiones-vecinos-colonias-capital">Peticiones de vecinos de colonias de la capital</a> — Código Qro, 13 de mayo de 2026.</li><li><a href="https://ladehoy.com.mx/en-villas-de-santiago-vecinos-abren-casa-amiga-de-agustin-dorantes/">Apertura de Casa Amiga en Villas de Santiago</a> — La de Hoy.</li><li><a href="https://elqueretano.info/trafico/abre-dorantes-4-casas-amigas-en-corregidora-y-queretaro/">Aperturas en San Pablo, Prados del Campestre y Cimatario</a> — El Queretano.</li><li><a href="https://github.com/angelnmara/geojson">Repositorio público de polígonos de México (angelnmara/geojson)</a> — límites municipales de Querétaro y polígonos de códigos postales del estado, usados para el mapa.</li></ul>';
  h += '<p class="t" style="color:#7b86a3">AGEVALÚA · www.agevalua.com · Prototipo de demostración, noviembre de 2026.</p></div>';
  return h;
}

function renderPanel(){
  panel.innerHTML = view==="site" ? siteHtml() : view==="about" ? aboutHtml() : homeHtml();
  panel.scrollTop = 0;
}
panel.addEventListener("click", function(e){
  var t = e.target;
  var chip = t.closest("button.chip");
  if(chip){ filt = chip.dataset.f; if(sel){ var s=GEO.sites.filter(function(x){return x.cp===sel;})[0]; if(!siteRows(s).some(matches)){ sel=""; view="home"; } } renderPanel(); drawSites(); return; }
  var rs = t.closest("button.row-s"); if(rs){ select(rs.dataset.cp, true); return; }
  if(t.closest("#back")){ sel=""; view="home"; renderPanel(); drawSites(); return; }
  if(t.closest("#about")){ view="about"; renderPanel(); return; }
  var m = t.closest("button.more");
  if(m){ var f=document.getElementById("f"+m.dataset.id); var o=f.classList.toggle("open"); m.textContent=o?"Ocultar":"Ver lo que dijo y lo que no"; }
});
function select(cp, center){
  sel = cp; view = "site"; renderPanel(); drawSites();
  if(center){ var s=GEO.sites.filter(function(x){return x.cp===cp;})[0]; flyTo(s.x, s.y); }
}

/* ---------------- map ---------------- */
var svg = document.getElementById("map"), wrap = document.getElementById("mapwrap"), tip = document.getElementById("tip");
var vb = {x:0,y:0,w:GEO.W,h:GEO.H};
function mk(tag, attrs, parent){
  var e = document.createElementNS(NS, tag);
  for(var k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e); return e;
}
var gBase, gSites, gLab;
function setVB(){ svg.setAttribute("viewBox", vb.x+" "+vb.y+" "+vb.w+" "+vb.h); scaleUI(); }
function unit(){ return vb.w / (svg.clientWidth||800); }   /* user units per pixel */
function scaleUI(){
  var u = unit();
  Array.prototype.forEach.call(gLab.childNodes, function(t){ t.setAttribute("font-size", (11*u).toFixed(2)); t.setAttribute("stroke-width", (3*u).toFixed(2)); });
  Array.prototype.forEach.call(gSites.querySelectorAll("g.mk"), function(g){
    var r = 15*u; var c=g.querySelector("circle.c"), h=g.querySelector("circle.h"), t=g.querySelector("text");
    c.setAttribute("r", r.toFixed(2)); c.setAttribute("stroke-width",(2.5*u).toFixed(2));
    h.setAttribute("r", (r*1.9).toFixed(2));
    t.setAttribute("font-size",(14*u).toFixed(2)); t.setAttribute("y",(5*u).toFixed(2));
  });
  Array.prototype.forEach.call(gSites.querySelectorAll("path.spoly"), function(p){ p.setAttribute("stroke-width",(1.6*u).toFixed(2)); });
  var cl = gBase.querySelector(".cpl"); if(cl) cl.setAttribute("stroke-width",(1*u).toFixed(2));
  var ol = gBase.querySelector(".ol"); if(ol) ol.setAttribute("stroke-width",(2.2*u).toFixed(2));
  Array.prototype.forEach.call(gBase.querySelectorAll(".db"), function(p){ p.setAttribute("stroke-width",(1.8*u).toFixed(2)); p.setAttribute("stroke-dasharray",(7*u).toFixed(2)+" "+(5*u).toFixed(2)); });
}
function buildBase(){
  svg.innerHTML = "";
  gBase = mk("g",{},svg);
  mk("path",{d:GEO.outline,fill:"#f8f6ef"},gBase);
  mk("path",{d:GEO.cp,fill:"none",stroke:"#cfd6e4","class":"cpl","stroke-opacity":".9"},gBase);
  mk("path",{d:GEO.outline,fill:"none",stroke:"#1f2d4d","class":"ol","stroke-linejoin":"round"},gBase);
  gSites = mk("g",{},svg);
  gLab = mk("g",{},svg);
  drawSites();
}
function drawSites(){
  gSites.innerHTML = "";
  var vs = visibleSites();
  vs.forEach(function(s){
    var c = COL[siteComp(s)], on = s.cp===sel;
    mk("path",{d:s.poly,fill:c,"fill-opacity":on?.55:.28,stroke:c,"stroke-linejoin":"round","class":"spoly","data-cp":s.cp},gSites);
  });
  vs.forEach(function(s){
    var c = COL[siteComp(s)], on = s.cp===sel;
    var g = mk("g",{"class":"mk","transform":"translate("+s.x+" "+s.y+")","data-cp":s.cp},gSites);
    mk("circle",{"class":"h",r:20,fill:c,"fill-opacity":on?.25:0},g);
    mk("circle",{"class":"c",r:15,fill:c,stroke:on?"#0f1f3d":"#fff"},g);
    var n = siteRows(s).filter(matches).length;
    var t = mk("text",{},g); t.textContent = n;
  });
  scaleUI();
}
svg.addEventListener("pointermove", function(e){
  var g = e.target.closest("[data-cp]");
  if(!g || dragging){ tip.style.opacity = 0; return; }
  var s = GEO.sites.filter(function(x){return x.cp===g.getAttribute("data-cp");})[0];
  var r = wrap.getBoundingClientRect();
  tip.innerHTML = s.name+'<small>'+siteRows(s).filter(matches).length+' registros · clic para ver</small>';
  tip.style.left = (e.clientX-r.left)+"px"; tip.style.top = (e.clientY-r.top)+"px"; tip.style.opacity = 1;
});
svg.addEventListener("pointerleave", function(){ tip.style.opacity = 0; });

/* pan / zoom */
var dragging = false, moved = 0, start = null;
svg.addEventListener("pointerdown", function(e){
  start = {x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}; moved = 0; dragging = true;
});
window.addEventListener("pointermove", function(e){
  if(!dragging || !start) return;
  var dx = e.clientX-start.x, dy = e.clientY-start.y; moved = Math.max(moved, Math.abs(dx)+Math.abs(dy));
  if(moved>4){ svg.classList.add("drag"); var u = unit(); vb.x = start.vx - dx*u; vb.y = start.vy - dy*u; setVB(); }
});
window.addEventListener("pointerup", function(e){
  if(!dragging) return; dragging = false; svg.classList.remove("drag");
  if(moved<=4){
    var g = e.target.closest && e.target.closest("[data-cp]");
    if(g && svg.contains(g)) select(g.getAttribute("data-cp"), false);
  }
  start = null;
});
function zoomAt(f, px, py){
  var r = svg.getBoundingClientRect();
  var fx = px===undefined ? .5 : (px-r.left)/r.width, fy = py===undefined ? .5 : (py-r.top)/r.height;
  var nw = Math.min(GEO.W*1.3, Math.max(GEO.W*.04, vb.w*f)), k = nw/vb.w;
  vb.x += (vb.w-nw)*fx; vb.y += (vb.h-vb.h*k)*fy; vb.w = nw; vb.h = vb.h*k; setVB();
}
svg.addEventListener("wheel", function(e){ e.preventDefault(); zoomAt(e.deltaY>0?1.2:1/1.2, e.clientX, e.clientY); }, {passive:false});
document.getElementById("zin").onclick = function(){ zoomAt(1/1.5); };
document.getElementById("zout").onclick = function(){ zoomAt(1.5); };
function fit(b, pad){
  var ar = (svg.clientWidth||800)/(svg.clientHeight||600);
  var w = (b.x1-b.x0)+pad*2, h = (b.y1-b.y0)+pad*2;
  if(w/h > ar) h = w/ar; else w = h*ar;
  vb = {x:(b.x0+b.x1)/2-w/2, y:(b.y0+b.y1)/2-h/2, w:w, h:h}; setVB();
}
function fitSites(){
  var xs = GEO.sites.map(function(s){return s.x;}), ys = GEO.sites.map(function(s){return s.y;});
  fit({x0:Math.min.apply(null,xs),x1:Math.max.apply(null,xs),y0:Math.min.apply(null,ys),y1:Math.max.apply(null,ys)}, 48);
}
function fitAll(){ fit({x0:0,x1:GEO.W,y0:0,y1:GEO.H}, 14); }
function flyTo(x,y){ vb.x = x - vb.w/2; vb.y = y - vb.h/2; setVB(); }
document.getElementById("zfit").onclick = fitSites;
document.getElementById("zall").onclick = fitAll;
window.addEventListener("resize", function(){ scaleUI(); });

buildBase(); renderPanel(); fitSites();
</script>
</body>
</html>
